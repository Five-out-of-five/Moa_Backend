# 로컬 개발용 의존 서비스. 비밀번호는 모두 개발 전용 값이다.
services:
  postgres:
    # moa_schema.sql 의 CREATE EXTENSION vector 때문에 pgvector 이미지를 쓴다.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: moa
      POSTGRES_USER: moa
      POSTGRES_PASSWORD: moa
    ports:
      # 로컬에 PostgreSQL 이 이미 5432 를 쓰고 있으면 POSTGRES_PORT 를 바꾸고 DB_URL 도 같은 포트로 맞춘다.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa -d moa"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Docker 가 켜지면 함께 올라온다. 직접 docker compose stop 하면 꺼진 채로 둔다.
    restart: unless-stopped
    ports:
      # 다른 Redis 가 이미 6379 를 쓰고 있으면 .env 의 REDIS_PORT 를 바꾼다. (애플리케이션도 같은 값을 읽는다)
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 공식 minio/minio 이미지는 공개 배포가 중단되어 받을 수 없다. 같은 서버를 패키징한 bitnami 이미지를 쓴다.
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 버킷을 만들고, 프로필·방 대표 이미지(public/) 만 공개 읽기로 연다. 첨부 파일은 서명 URL 로만 받는다.
  minio-init:
    # mc 는 minio 이미지에 포함되어 있다.
    image: bitnamilegacy/minio:2025.4.22
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/moa-local &&
      mc anonymous set download local/moa-local/public
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
