# 백엔드 CI/CD
# - PR(develop, main): 테스트만 실행한다.
# - develop 에 머지(push): 테스트 통과 후 EC2 에 SSH 로 접속해 app 컨테이너만 다시 빌드한다.
# - Actions 탭의 Run workflow 로 수동 실행도 할 수 있다.
#
# 필요한 저장소 Secrets: EC2_HOST(탄력적 IP), EC2_USER(ubuntu), EC2_SSH_KEY(배포 전용 개인 키)
# EC2 보안 그룹에 SSH(22) 인바운드가 GitHub 러너에서 열려 있어야 한다.
name: Backend CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 테스트는 local 프로필로 로컬 docker-compose.yml 의 서비스에 붙는다. 비밀값은 필요 없다.
      - name: 테스트용 PostgreSQL·Redis·MinIO 실행
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose up minio-init

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: chmod +x gradlew && ./gradlew test

      - name: 실패하면 테스트 리포트 저장
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: EC2에 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/Moa_Backend
            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop
            BUILDX_BAKE_ENTITLEMENTS_FS=0 docker compose -f docker-compose.prod.yml up -d --build --no-deps app
            docker image prune -f

            # 서버가 정상 기동했는지 확인한다. 3분 안에 health 가 UP 이 아니면 실패로 끝낸다.
            for i in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"UP"'; then
                echo "배포 완료: health UP"
                exit 0
              fi
              sleep 5
            done
            echo "health 확인 실패. 최근 로그:"
            docker compose -f docker-compose.prod.yml logs --tail 80 app
            exit 1
