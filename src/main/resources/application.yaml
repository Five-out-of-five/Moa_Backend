spring:
  application:
    name: moa_backend

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        # 로컬(평문 Docker Redis)은 false, 전송 중 암호화를 쓰는 관리형 Redis는 true
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      connect-timeout: 10000ms
      lettuce:
        shutdown-timeout: 200ms

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moa}
    username: ${DB_USERNAME:moa}
    password: ${DB_PASSWORD:moa}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(src/main/resources/db/migration/V*.sql)로 관리한다.
      # validate 는 엔티티와 테이블이 어긋나면 애플리케이션 시작을 실패시킨다. Hibernate 가 스키마를 바꾸지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          # 저장은 UTC 로 통일한다. 응답의 KST(+09:00) 변환은 Jackson 직렬화(TimeJacksonConfig)가 담당한다.
          time_zone: UTC

  servlet:
    multipart:
      # 요구사항 55: 첨부 1건당 20MB. 이미지 용도별 5MB 제한은 FileCommandService 가 검사한다.
      max-file-size: 20MB
      # 파일 1건 + multipart 경계·JSON 파트 여유분
      max-request-size: 25MB

  security:
    oauth2:
      client:
        # 값이 비어 있으면 Spring Boot 가 기동을 막으므로 로컬용 자리표시 값을 기본으로 둔다.
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-placeholder}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:local-placeholder}
            client-secret: ${KAKAO_CLIENT_SECRET:local-placeholder}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname,account_email
          naver:
            client-id: ${NAVER_CLIENT_ID:local-placeholder}
            client-secret: ${NAVER_CLIENT_SECRET:local-placeholder}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    # 한도를 넘긴 업로드도 본문을 끝까지 읽어야 413 응답이 클라이언트에 전달된다.
    max-swallow-size: 25MB

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    # @Tag 이름에 붙인 번호 순서대로 정렬한다. (01. Auth → 02. Account → ...)
    tags-sorter: alpha
    operations-sorter: method
    # 모든 태그를 접은 상태로 열어 전체 API 구조를 한눈에 볼 수 있게 한다.
    doc-expansion: none

jwt:
  # 실제 키 기본값을 두지 않는다. 미주입 시 기동이 실패하도록 해서, 공개된 키로 서명된 토큰이
  # 운영에 나가는 상황을 막는다. (생성 예: openssl rand -base64 48)
  #
  # 빈 문자열을 기본값으로 둔 이유: 플레이스홀더 치환 자체가 실패하면 "Unsatisfied dependency"
  # 같은 원인 불명 메시지만 보인다. 빈 값으로 들여보낸 뒤 GlobalJwtProvider가 검증해
  # 무엇을 주입해야 하는지 알려주는 편이 낫다.
  secret-key: ${JWT_SECRET_KEY:}
  access-token-expiration: 7200000 # 2시간 (요구사항 명세·API 명세 기준)
  refresh-token-expiration: 604800000 # 7일
  # 값을 비워두면 쿠키에 Domain 속성을 붙이지 않아(host-only) localhost에서도 정상 동작한다.
  cookie-domain: ${COOKIE_DOMAIN:}
  # 로컬(http)에서는 false, 배포(https)에서는 true
  cookie-secure: ${COOKIE_SECURE:false}

app:
  cors:
    # 프론트엔드 도메인을 명시한다. (와일드카드 * 는 credentials와 함께 사용할 수 없음)
    # WebSocket 핸드셰이크 허용 오리진도 이 값을 함께 사용한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

  websocket:
    # STOMP 핸드셰이크 경로. 바꾸면 GlobalSecurityConfig의 permitAll 경로도 함께 맞춰야 한다.
    endpoint: ${WEBSOCKET_ENDPOINT:/ws}

  # 소셜 로그인 후 돌아갈 프론트엔드 주소
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  ai:
    # Python AI 서버. 연결에 실패해도 서버는 정상 기동한다. (docs/ai-server.md)
    server-url: ${AI_SERVER_URL:http://localhost:8000}
    connect-timeout: 2s
    read-timeout: 30s
    health-interval: 15s
    # 비용 임계치 (관리자 AI 사용량 화면)
    cost-threshold: ${AI_COST_THRESHOLD:80}
    # 방별 일일 호출 한도 (API 명세 '15. AI')
    quota:
      assistant: 30
      summary: 10
      compromise: 10
      layout: 5
      tone: 100
      conflict: 200

  report:
    # 허위 신고 판정이 기간 내 기준 횟수를 넘으면 신고 기능을 제한한다.
    false-report-threshold: 3
    false-report-window-days: 30
    block-days: 30

  integration:
    # 슬랙 Webhook·노션 토큰 암호화 키. 비우면 JWT 서명 키에서 파생한다.
    secret-key: ${INTEGRATION_SECRET_KEY:}
    slack-fail-threshold: 5
    notion-client-id: ${NOTION_CLIENT_ID:}
    notion-client-secret: ${NOTION_CLIENT_SECRET:}
    notion-redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/api/v1/integrations/notion/callback}

cloud:
  aws:
    s3:
      # 단일 버킷명. 필수값이다. 도메인 구분은 버킷이 아니라 object key의 prefix로 표현한다.
      # 빈 기본값을 두는 이유는 jwt.secret-key와 동일하다. (S3Settings가 검증하고 안내한다)
      bucket: ${S3_BUCKET:}
      # 응답 URL 루트. 비워두면 https://{bucket}.s3.{region}.amazonaws.com 으로 조합한다.
      # CloudFront를 쓸 때만 해당 도메인을 넣는다.
      cdn-url: ${S3_CDN_URL:}
      # MinIO 등 S3 호환 스토리지 주소. 비우면(AWS) SDK 가 리전으로 엔드포인트를 결정한다.
      endpoint: ${S3_ENDPOINT:}
      # 브라우저가 접근하는 주소. 비우면 endpoint 를 그대로 쓴다.
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    credentials:
      # 비워두면 AWS 기본 자격증명 체인(환경변수 / ~/.aws / EC2·ECS IAM 역할)을 사용한다.
      # 배포 환경에서는 키를 심지 말고 IAM 역할을 쓰는 편이 안전하다.
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
