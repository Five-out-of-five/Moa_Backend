# 로컬 개발 전용 설정.
#
# 실행 순서
#   1) docker compose up -d        (PostgreSQL + pgvector, Redis, MinIO)
#   2) ./gradlew bootRun --args='--spring.profiles.active=local'
#
# 주의
#   - 이 파일의 값은 local 프로파일을 명시적으로 활성화할 때만 적용된다.
#   - 아래 키는 docker-compose.yml 의 개발 전용 값이다. 운영에서는 절대 사용하지 말 것.
#   - AWS S3 로 바꾸려면 S3_ENDPOINT 를 비우고 S3_BUCKET·AWS_* 만 주입한다. 코드는 그대로다.

jwt:
  # 개발 전용 더미 키 (32바이트 이상). 운영에서는 환경변수로 주입한다.
  secret-key: ${JWT_SECRET_KEY:local-development-only-dummy-key-do-not-use-in-production}
  cookie-secure: false

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET:moa-local}
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
    credentials:
      access-key: ${AWS_ACCESS_KEY:minioadmin}
      secret-key: ${AWS_SECRET_KEY:minioadmin}

logging:
  level:
    org.hibernate.SQL: debug
