# 운영 배포 (EC2 한 대 + CDN). 사용법은 deploy/cdn/README.md
#
#   CDN(HTTPS) ─┬─ 기본 경로 ──────────────────────▶ EC2:3000  front (Next)
#               └─ /api/v1/* /oauth2/* /login/oauth2/*
#                  /ws* /swagger-ui* /v3/api-docs* ─▶ EC2:8080  app (Spring)
#   app ─▶ redis (내부망), ai (내부망), RDS(PostgreSQL), S3
#
# 외부에 여는 포트는 3000, 8080 두 개뿐이다. redis·ai 는 내부망에서만 통신한다.
# DB 는 RDS, 파일은 S3 를 쓰므로 여기에 없다.

name: moa

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/cdn/backend.Dockerfile
    image: moa-backend:latest
    restart: unless-stopped
    env_file: env/backend.env
    environment:
      # 내부망 주소는 여기서 고정한다. env/backend.env 에 같은 키가 있어도 이 값이 우선한다.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?deploy/cdn/.env 에 REDIS_PASSWORD 를 넣어 주세요}
      AI_SERVER_URL: http://ai:8000
      # application.yaml 의 SQL debug 로그를 운영에서는 끈다.
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: info
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_started

  front:
    build:
      context: .
      dockerfile: front.Dockerfile
      additional_contexts:
        front_src: ${FRONT_DIR:-../../../Moa_Front}
      secrets:
        - front_env
    image: moa-front:latest
    restart: unless-stopped
    env_file: env/front.env
    environment:
      # Next 서버(BFF)는 인터넷을 거치지 않고 내부망으로 Spring 을 부른다.
      BACKEND_BASE_URL: http://app:8080
    ports:
      - "3000:3000"
    depends_on:
      - app

  ai:
    build: ${AI_DIR:-../../../Moa_Python}
    image: moa-ai:latest
    restart: unless-stopped
    env_file: env/ai.env
    expose:
      - "8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  front_env:
    file: env/front.env

volumes:
  redis-data:
  app-logs:
