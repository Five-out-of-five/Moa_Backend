# 서버 호스트에 설치된 Nginx 용 설정. (Docker 가 아니라 apt 로 설치한 Nginx)
#
#   sudo cp deploy/host-nginx/moarang.kro.kr.conf /etc/nginx/sites-available/moarang.kro.kr
#   sudo ln -s /etc/nginx/sites-available/moarang.kro.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 인증서는 먼저 발급해 둔다: sudo certbot certonly --nginx -d moarang.kro.kr   (docs/deploy.md)
# 80 은 443 으로 보내고, 443 에서 TLS 를 풀어 Docker Nginx(127.0.0.1:8080)로 넘긴다.

# 다른 사이트 설정의 map 과 이름이 겹치지 않게 접두사를 붙인다.
map $http_upgrade $moa_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name moarang.kro.kr;

    # 인증서 갱신(certbot) 요청은 리다이렉트하지 않는다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name moarang.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/moarang.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moarang.kro.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:moa_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location / {
        # docker-compose.prod.yml 의 NGINX_PORT 와 같아야 한다.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket(/ws)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $moa_connection_upgrade;

        # MinIO 서명 URL 검증에 Host 가 쓰이므로 도메인을 그대로 넘긴다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(AI 스트리밍)·WebSocket 이 끊기지 않게 한다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
